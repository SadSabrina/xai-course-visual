<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плотная область</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --ink:#e8ecf4; --muted:#9aa6bd;
    --dot:#5a6785; --a:#4c8dff; --line:#26304a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --panel:#ffffff; --ink:#141a26; --muted:#5b667c; --dot:#b3bccd; --line:#e2e7f1; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       display:flex;flex-direction:column;padding:12px;gap:10px}
  .head{flex:0 0 auto}
  .head h1{font-size:16px;margin:0 0 2px}
  .head p{color:var(--muted);margin:0;font-size:12.5px}
  .stage{flex:1 1 auto;position:relative;min-height:0;
         background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
         cursor:grab;touch-action:none}
  .stage:active{cursor:grabbing}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
  <div class="head">
    <h1>Плотная область</h1>
    <p>Перетаскивай <b style="color:var(--a)">плотную область</b> по полю. Внутри — много точек на площадь, снаружи — редко. Это и есть «плотная область».</p>
  </div>
  <div class="stage" id="stage"><canvas id="c"></canvas></div>

<script>
const stage=document.getElementById('stage');
const cvs=document.getElementById('c');
const ctx=cvs.getContext('2d');
let W=0,H=0;

// редкий фон — нормализованные координаты [0..1], фиксируются один раз
const M=200;
const bg=Array.from({length:M},()=>[Math.random(),Math.random()]);

// плотный сгусток — стандартные нормальные смещения (форма постоянна при таскании)
function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const K=110;
const blob=Array.from({length:K},()=>[gauss(),gauss()]);

// центр плотной области — тоже в нормализованных координатах
let cx=0.5, cy=0.42;

function resize(){
  const r=cvs.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  W=r.width; H=r.height;
  cvs.width=Math.round(W*dpr); cvs.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function draw(){
  if(!W||!H) return;
  ctx.clearRect(0,0,W,H);
  const base=Math.min(W,H);
  const spread=base*0.075;          // радиус плотного облака
  const dot=Math.max(2.5,base*0.007);

  // фон
  ctx.fillStyle=getCss('--dot');
  for(const [nx,ny] of bg){
    ctx.beginPath(); ctx.arc(nx*W,ny*H,dot,0,2*Math.PI); ctx.fill();
  }

  // круг области
  const px=cx*W, py=cy*H, r=2.3*spread;
  ctx.beginPath(); ctx.arc(px,py,r,0,2*Math.PI);
  ctx.fillStyle='rgba(76,141,255,.12)'; ctx.fill();
  ctx.strokeStyle=getCss('--a'); ctx.globalAlpha=.5; ctx.lineWidth=2;
  ctx.setLineDash([6,7]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;

  // плотный сгусток
  ctx.fillStyle=getCss('--a');
  for(const [ox,oy] of blob){
    ctx.beginPath(); ctx.arc(px+ox*spread,py+oy*spread,dot,0,2*Math.PI); ctx.fill();
  }
}

function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

// перетаскивание
let dragging=false;
function moveTo(e){
  const r=cvs.getBoundingClientRect();
  cx=Math.min(0.95,Math.max(0.05,(e.clientX-r.left)/r.width));
  cy=Math.min(0.95,Math.max(0.05,(e.clientY-r.top)/r.height));
  draw();
}
stage.addEventListener('pointerdown',e=>{dragging=true;stage.setPointerCapture(e.pointerId);moveTo(e);});
stage.addEventListener('pointermove',e=>{if(dragging)moveTo(e);});
stage.addEventListener('pointerup',()=>dragging=false);
stage.addEventListener('pointercancel',()=>dragging=false);

new ResizeObserver(resize).observe(cvs);
resize();
</script>
</body>
</html>
