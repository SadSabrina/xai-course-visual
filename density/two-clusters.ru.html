<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плотность точек двух кластеров</title>
<link rel="stylesheet" href="../assets/viz.css">
</head>
<body class="viz" data-palette="density">
  <div class="viz-head">
    <h1>Что такое плотность точек</h1>
    <p>Крути плотность от 0 до 1. Точек столько же — меняется площадь (area). Плотность = n_points ÷ area.</p>
  </div>

  <div class="viz-stage"><canvas id="c"></canvas></div>

  <div class="viz-controls">
    <div class="viz-row">
      <span class="viz-label">Плотность</span>
      <input id="s" type="range" min="0" max="1" step="0.01" value="0.5">
      <span class="viz-val" id="sv">0.50</span>
    </div>
    <div class="viz-legend">
      <span class="item"><span class="swatch" style="background:var(--s1)"></span>Кластер&nbsp;A</span>
      <span class="item"><span class="swatch" style="background:var(--s2)"></span>Кластер&nbsp;B</span>
    </div>
  </div>

<script src="../assets/viz.js"></script>
<script>
const N = 160;                                   // точек в каждом кластере (фиксировано)
const offA = Array.from({length:N},()=>[VIZ.gaussian(),VIZ.gaussian()]);
const offB = Array.from({length:N},()=>[VIZ.gaussian(),VIZ.gaussian()]);
const slider = document.getElementById('s');
const sv = document.getElementById('sv');

const view = VIZ.mount(document.getElementById('c'), (ctx, W, H) => {
  ctx.clearRect(0,0,W,H);
  const base = Math.min(W,H);
  const d = parseFloat(slider.value);
  const spread = base*0.30 + (base*0.045 - base*0.30)*d;   // плотность 1 → сжато
  const dot = Math.max(2.5, base*0.007);

  const A = {x:W*0.34, y:H*0.5};
  const B = {x:W*0.66, y:H*0.5};
  VIZ.region(ctx, A.x, A.y, 2*spread, VIZ.css('--s1'));
  VIZ.region(ctx, B.x, B.y, 2*spread, VIZ.css('--s2'));
  VIZ.cloud(ctx, A.x, A.y, offA, spread, VIZ.css('--s1'), dot);
  VIZ.cloud(ctx, B.x, B.y, offB, spread, VIZ.css('--s2'), dot);
});

slider.addEventListener('input', () => {
  sv.textContent = parseFloat(slider.value).toFixed(2);
  view.redraw();
});
</script>
</body>
</html>
