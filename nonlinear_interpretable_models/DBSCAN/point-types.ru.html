<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DBSCAN: типы точек</title>
<link rel="stylesheet" href="/xai-course-visual/assets/viz.css">
</head>
<body class="viz" data-palette="density">
  <div class="viz-head">
    <h1>DBSCAN: типы точек</h1>
    <p>Переключай вкладки. Точки раскрашены по типу; вкладка добавляет отношение между ними. minPts = 3, ε — радиус кругов.</p>
  </div>

  <div class="viz-tabs" id="tabs">
    <button class="viz-tab active" data-tab="core">Ядровые</button>
    <button class="viz-tab" data-tab="direct">Напрямую достижимые</button>
    <button class="viz-tab" data-tab="reach">Плотностно-достижимые</button>
    <button class="viz-tab" data-tab="connect">Плотностно-связанные</button>
  </div>

  <div class="viz-stage"><canvas id="c"></canvas></div>

  <div class="viz-controls">
    <p id="cap" style="margin:0 0 8px"></p>
    <div class="viz-legend">
      <span class="item"><span class="swatch" style="background:var(--s1)"></span>Ядровые (core)</span>
      <span class="item"><span class="swatch" style="background:var(--s2)"></span>Граничные (border)</span>
      <span class="item"><span class="swatch" style="background:var(--dot)"></span>Шум (noise)</span>
    </div>
  </div>

<script src="/xai-course-visual/assets/viz.js"></script>
<script>
// --- сцена: 7 точек в дизайн-координатах (box 2.0 x 1.2), ε и minPts ---
const P = [
  {x:0.15, y:0.62, label:'A'}, // 0
  {x:0.48, y:0.52, label:'B'}, // 1
  {x:0.85, y:0.60, label:'C'}, // 2
  {x:1.20, y:0.50, label:'D'}, // 3
  {x:1.55, y:0.60, label:'E'}, // 4
  {x:1.85, y:0.54, label:'F'}, // 5
  {x:1.00, y:1.08, label:'G'}, // 6  (шум)
];
const BOX_W = 2.0, BOX_H = 1.2, EPS = 0.42, MINPTS = 3;

// --- классификация точек по ε и minPts ---
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
const nbrs = i => P.map((_,j)=>j).filter(j=>j!==i && dist(P[i],P[j])<EPS);
P.forEach((p,i)=>{
  const n = nbrs(i);
  p.core = n.length+1 >= MINPTS;            // |N_ε(p)| ≥ minPts (включая саму)
});
P.forEach((p,i)=>{
  if(p.core) p.type='core';
  else if(nbrs(i).some(j=>P[j].core)) p.type='border';
  else p.type='noise';
});

// --- отношения (индексы точек) ---
const DIRECT_FROM = 2;                       // C
const DIRECT_TO   = nbrs(2);                 // соседи C в ε (B, D)
const REACH_CHAIN = [1,2,3,4,5];             // B→C→D→E→F (несимметрично)
const CONN_CORE   = 2;                       // общая ядровая C
const CONN_LEFT   = [2,1,0];                 // C→B→A
const CONN_RIGHT  = [2,3,4,5];               // C→D→E→F

const CAP = {
  core:    'Ядровая (core): в её ε-окрестности набирается ≥ minPts точек. Синие — ядровые, оранжевые — граничные (лежат в чужой ε, но своей плотности не хватает), серые — шум.',
  direct:  'Напрямую достижимая: точка внутри ε-окрестности ядровой. Стрелка идёт от ядровой C к её соседям B и D.',
  reach:   'Плотностно-достижимая: цепочка ядровых, каждая следующая — в ε-окрестности предыдущей (пересекающиеся круги, как круги на воде). Стрелки в одну сторону: из F назад нельзя — F не ядровая. Отношение несимметрично.',
  connect: 'Плотностно-связанные: A и F ПЛОТНОСТНО-достижимы из общей ядровой C — по цепочкам ядровых через их ε-окрестности (стрелки от C). Поэтому A и F связаны, и связь симметрична (дуга A↔F): переставь их местами — ничего не изменится. На связанности держится кластер.',
};

let tab = 'core';
const cap = document.getElementById('cap');
const css = n => VIZ.css(n);

const view = VIZ.mount(document.getElementById('c'), (ctx, W, H) => {
  ctx.clearRect(0,0,W,H);
  const pad = Math.min(W,H)*0.10;
  const scale = Math.min((W-2*pad)/BOX_W, (H-2*pad)/BOX_H);
  const ox = (W - BOX_W*scale)/2, oy = (H - BOX_H*scale)/2;
  const map = p => [ox + p.x*scale, oy + p.y*scale];
  const R = scale*EPS;
  const dotR = Math.max(6, Math.min(W,H)*0.017);
  const labelSize = Math.max(12, Math.min(W,H)*0.032);
  const accent = css('--accent'), blue = css('--s1');

  const epsRing = (i, color) => { const [x,y]=map(P[i]);
    VIZ.ring(ctx, x, y, R, color, {alpha:0.45, dash:[5,7], width:1.5,
      fill:VIZ.alpha(color,0.07), fillAlpha:1}); };
  const link = (i,j,opts) => { const a=map(P[i]), b=map(P[j]);
    VIZ.arrow(ctx, a[0],a[1], b[0],b[1], accent,
      Object.assign({width:2.2, trim1:dotR+4, trim2:dotR+5, headSize:9}, opts)); };
  // симметричная дуга-связь между двумя точками (двойная стрелка + подпись)
  const connectArc = (i,j,lift,label) => {
    const a=map(P[i]), b=map(P[j]);
    a[1]-=dotR; b[1]-=dotR;
    const midY=(a[1]+b[1])/2;
    lift = Math.min(lift, midY - 26);                 // не вылезать за верх сцены
    const cx=(a[0]+b[0])/2, cy=midY - lift;
    ctx.strokeStyle=accent; ctx.fillStyle=accent; ctx.lineWidth=2.2;
    ctx.setLineDash([2,6]); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.quadraticCurveTo(cx,cy,b[0],b[1]); ctx.stroke();
    ctx.setLineDash([]); ctx.lineCap='butt';
    const head=(pt,dx,dy)=>{ const ang=Math.atan2(dy,dx), h=9;
      ctx.beginPath(); ctx.moveTo(pt[0],pt[1]);
      ctx.lineTo(pt[0]-h*Math.cos(ang-0.42), pt[1]-h*Math.sin(ang-0.42));
      ctx.lineTo(pt[0]-h*Math.cos(ang+0.42), pt[1]-h*Math.sin(ang+0.42));
      ctx.closePath(); ctx.fill(); };
    head(b, b[0]-cx, b[1]-cy);
    head(a, a[0]-cx, a[1]-cy);
    ctx.fillStyle=css('--ink'); ctx.font=`600 ${Math.max(11,Math.min(W,H)*0.026)}px system-ui, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(label, cx, cy-4);
  };

  // --- слой отношений (под точками) ---
  if(tab==='core'){
    P.forEach((p,i)=>{ if(p.core) epsRing(i, blue); });
  } else if(tab==='direct'){
    epsRing(DIRECT_FROM, blue);
    DIRECT_TO.forEach(j => link(DIRECT_FROM, j));
  } else if(tab==='reach'){
    REACH_CHAIN.forEach(i => { if(P[i].core) epsRing(i, blue); });
    for(let k=0;k<REACH_CHAIN.length-1;k++) link(REACH_CHAIN[k], REACH_CHAIN[k+1]);
  } else if(tab==='connect'){
    // ε-окрестности вдоль обеих цепочек — подчёркиваем «плотностно»
    [1,3,4].forEach(i => epsRing(i, blue));
    epsRing(CONN_CORE, accent);
    // плотностная достижимость из C в обе стороны (стрелки в одну сторону)
    for(let k=0;k<CONN_LEFT.length-1;k++)  link(CONN_LEFT[k],  CONN_LEFT[k+1]);   // C→B→A
    for(let k=0;k<CONN_RIGHT.length-1;k++) link(CONN_RIGHT[k], CONN_RIGHT[k+1]);  // C→D→E→F
    // симметричная связь A↔F (дуга сверху)
    connectArc(0, 5, scale*0.60, 'связаны');
  }

  // множество подсвеченных точек
  const hi = new Set(
    tab==='direct'  ? [DIRECT_FROM, ...DIRECT_TO] :
    tab==='reach'   ? REACH_CHAIN :
    tab==='connect' ? [0,5, CONN_CORE] : []
  );

  // --- точки поверх ---
  const colorFor = t => t==='core'?css('--s1') : t==='border'?css('--s2') : css('--dot');
  P.forEach((p,i)=>{
    const [x,y]=map(p);
    if(hi.has(i)){ ctx.strokeStyle=accent; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(x,y,dotR+4,0,2*Math.PI); ctx.stroke(); }
    ctx.fillStyle=colorFor(p.type);
    ctx.beginPath(); ctx.arc(x,y,dotR,0,2*Math.PI); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=css('--surface'); ctx.stroke();
    ctx.fillStyle=css('--ink'); ctx.font=`600 ${labelSize}px system-ui, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(p.label, x, y-dotR-3);
  });
});

// --- вкладки ---
cap.textContent = CAP[tab];
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.viz-tab'); if(!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll('.viz-tab').forEach(x=>x.classList.toggle('active', x===b));
  cap.textContent = CAP[tab];
  view.redraw();
});
</script>
</body>
</html>
