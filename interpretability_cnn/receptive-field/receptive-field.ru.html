<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рецептивное поле растёт с глубиной</title>
<link rel="stylesheet" href="/xai-course-visual/assets/viz.css">
<style>
  .board{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
         box-shadow:var(--shadow); padding:20px 22px; display:flex; flex-direction:column; gap:14px}
  .panels{display:flex; gap:34px; align-items:center; justify-content:center; flex-wrap:wrap}
  .panels svg{width:100%; height:auto}
  .pA{max-width:340px} .pB{max-width:330px}
  .legend{display:flex; gap:18px 22px; flex-wrap:wrap; justify-content:center;
          font-size:15px; color:var(--ink); align-items:center}
  .legend .it{display:inline-flex; align-items:center; gap:8px}
  .legend .sw{width:16px; height:16px; border-radius:4px; flex:0 0 auto}
  .notes{display:flex; gap:10px 20px; flex-wrap:wrap; justify-content:center; margin-top:2px}
  .chip{font-size:13.5px; font-weight:600; color:var(--s2); border:1px solid var(--s2);
        border-radius:999px; padding:3px 12px; background:color-mix(in srgb,var(--s2) 8%,transparent)}
  @media (max-width:640px){ .panels{gap:20px} }
</style>
</head>
<body class="viz" data-palette="channels">
  <div class="board">
    <div class="panels">
      <!-- ПАНЕЛЬ A: нарастающие поля на изображении -->
      <svg class="pA" viewBox="0 0 320 336" role="img" aria-label="нарастающее рецептивное поле на изображении">
        <defs>
          <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="color-mix(in srgb,var(--s1) 12%,var(--plane))"/>
            <stop offset="1" stop-color="var(--plane)"/>
          </linearGradient>
        </defs>
        <rect x="10" y="10" width="300" height="300" rx="6" fill="url(#img)" stroke="var(--line)"/>
        <!-- пиксельная сетка -->
        <g id="grid"></g>
        <!-- поля (от большого к малому) -->
        <rect x="18" y="18" width="284" height="284" rx="3" fill="color-mix(in srgb,var(--s2) 7%,transparent)"
              stroke="var(--s2)" stroke-opacity="0.5" stroke-width="1.6" stroke-dasharray="6 5"/>
        <rect x="90"  y="90"  width="140" height="140" fill="color-mix(in srgb,var(--s2) 13%,transparent)" stroke="var(--s2)" stroke-opacity="0.55" stroke-width="2"/>
        <rect x="110" y="110" width="100" height="100" fill="color-mix(in srgb,var(--s2) 21%,transparent)" stroke="var(--s2)" stroke-opacity="0.7" stroke-width="2.2"/>
        <rect x="130" y="130" width="60"  height="60"  fill="color-mix(in srgb,var(--s2) 34%,transparent)" stroke="var(--s2)" stroke-width="2.6"/>
        <!-- нейрон в центре -->
        <circle cx="160" cy="160" r="4.5" fill="var(--s2)" stroke="#fff" stroke-width="1.4"/>
        <text x="160" y="328" text-anchor="middle" font-family="Manrope,system-ui" font-size="14"
              font-weight="600" fill="var(--ink-2)">одно и то же изображение</text>
      </svg>

      <!-- ПАНЕЛЬ B: конус одного глубокого нейрона -->
      <svg class="pB" viewBox="0 0 340 336" role="img" aria-label="рецептивное поле глубокого нейрона: конус 3 - 5 - 7">
        <g id="cone"></g>
      </svg>
    </div>

    <div class="legend">
      <span class="it"><span class="sw" style="background:color-mix(in srgb,var(--s2) 34%,transparent);border:1px solid var(--s2)"></span>слой 1 · 3×3</span>
      <span class="it"><span class="sw" style="background:color-mix(in srgb,var(--s2) 21%,transparent);border:1px solid color-mix(in srgb,var(--s2) 70%,transparent)"></span>слой 2 · 5×5</span>
      <span class="it"><span class="sw" style="background:color-mix(in srgb,var(--s2) 13%,transparent);border:1px solid color-mix(in srgb,var(--s2) 55%,transparent)"></span>слой 3 · 7×7</span>
      <span class="it"><span class="sw" style="background:color-mix(in srgb,var(--s2) 7%,transparent);border:1.5px dashed var(--s2)"></span>глубокие слои ≈ всё изображение</span>
    </div>
    <div class="notes">
      <span class="chip">каждый слой 3×3 → +2</span>
      <span class="chip">pooling → ×2</span>
      <span class="chip">VGG / ResNet: поле ≈ вся картинка</span>
    </div>
  </div>

<script>
const NS='http://www.w3.org/2000/svg';
function el(t,a){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; }
// сетка на изображении (панель A)
(function(){ const g=document.getElementById('grid');
  for(let i=1;i<15;i++){ const p=10+i*20;
    g.appendChild(el('line',{x1:p,y1:10,x2:p,y2:310,stroke:'var(--line)','stroke-width':0.8,opacity:0.55}));
    g.appendChild(el('line',{x1:10,y1:p,x2:310,y2:p,stroke:'var(--line)','stroke-width':0.8,opacity:0.55})); }
})();
// конус (панель B): вход 7 → conv1 5 → conv2 3 → conv3 1
(function(){ const g=document.getElementById('cone');
  const x0=58, dx=30, R=6.5;
  const rows=[ {y:280,n:7,off:0}, {y:200,n:5,off:1,fld:'3×3'}, {y:120,n:3,off:2,fld:'5×5'}, {y:44,n:1,off:3} ];
  const px=(off,i)=>x0+(off+i)*dx;
  // рёбра (каждый узел ← 3 снизу)
  for(let r=1;r<rows.length;r++){ const up=rows[r], lo=rows[r-1];
    for(let i=0;i<up.n;i++){ for(let d=0;d<3;d++){
      g.appendChild(el('line',{x1:px(up.off,i),y1:up.y+R,x2:px(lo.off,i+d),y2:lo.y-R,
        stroke:'var(--s2)','stroke-width':1.4,'stroke-opacity':0.5})); } } }
  // узлы
  rows.forEach(row=>{ for(let i=0;i<row.n;i++){
    g.appendChild(el('circle',{cx:px(row.off,i),cy:row.y,r:R,fill:'var(--s2)',stroke:'#fff','stroke-width':1.4})); } });
  const T=(x,y,t,col,size,anc,w)=>{ const e=el('text',{x,y,'text-anchor':anc||'start','font-family':'Manrope,system-ui','font-size':size||13,'font-weight':w||600,fill:col||'var(--ink-2)'}); e.textContent=t; g.appendChild(e); };
  // верхний нейрон
  T(px(3,0)+14, 48, 'нейрон · слой 3', 'var(--s2)','13.5','start',700);
  // размер поля у слоёв 1 и 2 (справа)
  const rx=x0+6.7*dx;
  T(rx, 205, '3×3', 'var(--ink-2)','14','start',700);
  T(rx, 125, '5×5', 'var(--ink-2)','14','start',700);
  // вход
  T(x0-12, 285, 'вход', 'var(--ink-2)','13','end',700);
  // скобка поля на входе = 7
  const xa=px(0,0)-R, xb=px(0,6)+R;
  g.appendChild(el('path',{d:`M${xa} 300 L${xa} 308 L${xb} 308 L${xb} 300`,fill:'none',stroke:'var(--s2)','stroke-width':1.6}));
  T((xa+xb)/2, 326, 'рецептивное поле = 7×7', 'var(--s2)','13.5','middle',700);
})();
</script>
</body>
</html>
