<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViT architecture</title>
<link rel="stylesheet" href="/xai-course-visual/assets/viz.css">
<style>
  .board{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
         box-shadow:var(--shadow); padding:20px 22px}
  .board svg{width:100%; height:auto; display:block}
</style>
</head>
<body class="viz" data-palette="vit">
  <div class="board">
    <svg viewBox="0 0 880 320" role="img" aria-label="ViT: image to patches, patches to tokens, [CLS] and transformer blocks">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2)"/>
        </marker>
        <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="color-mix(in srgb,var(--s1) 26%,var(--plane))"/>
          <stop offset="0.55" stop-color="color-mix(in srgb,var(--s2) 20%,var(--plane))"/>
          <stop offset="1" stop-color="var(--plane)"/>
        </linearGradient>
      </defs>

      <!-- 1. изображение с сеткой патчей -->
      <g font-family="Manrope, system-ui">
        <rect x="24" y="66" width="140" height="140" rx="6" fill="url(#img)" stroke="var(--line)"/>
        <g id="pgrid" stroke="var(--line)" stroke-width="0.8" opacity="0.7"></g>
        <rect id="hp" x="0" y="0" width="10" height="10" fill="none" stroke="var(--s2)" stroke-width="2.4"/>
        <text x="94" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">input · 224×224</text>
        <text x="94" y="224" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink-2)">patches 16×16 → 14×14 = 196</text>
      </g>

      <!-- стрелка к токенам -->
      <line x1="170" y1="136" x2="322" y2="136" stroke="var(--ink-2)" stroke-width="2" marker-end="url(#ah)"/>
      <text x="246" y="124" text-anchor="middle" font-family="Manrope,system-ui" font-size="12" font-weight="600" fill="var(--ink-2)">flatten + projection</text>

      <!-- 2. последовательность токенов (список) -->
      <g id="tokens" font-family="Manrope, system-ui"></g>
      <text x="470" y="56" text-anchor="middle" font-family="Manrope,system-ui" font-size="14" font-weight="700" fill="var(--ink)">token list · each of length D</text>
      <text x="470" y="200" text-anchor="middle" font-family="Manrope,system-ui" font-size="13" font-weight="600" fill="var(--s2)">[CLS] — a special token; classification runs on it</text>

      <!-- стрелка к блокам -->
      <line x1="700" y1="136" x2="742" y2="136" stroke="var(--ink-2)" stroke-width="2" marker-end="url(#ah)"/>

      <!-- 3. блоки трансформера -->
      <g font-family="Manrope, system-ui">
        <rect x="748" y="86" width="108" height="100" rx="10" fill="color-mix(in srgb,var(--s2) 9%,transparent)" stroke="var(--s2)" stroke-width="1.6"/>
        <g stroke="color-mix(in srgb,var(--s2) 45%,transparent)" stroke-width="1">
          <line x1="762" y1="112" x2="842" y2="112"/><line x1="762" y1="130" x2="842" y2="130"/>
          <line x1="762" y1="148" x2="842" y2="148"/><line x1="762" y1="166" x2="842" y2="166"/>
        </g>
        <text x="802" y="104" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--s2)">Transformer</text>
        <text x="802" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">× L blocks</text>
        <text x="802" y="224" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink-2)">activations (197, D)</text>
      </g>
    </svg>
  </div>

<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
// сетка патчей 14×14 на изображении + подсветка одного патча
(function(){ const g=document.getElementById('pgrid'), x0=24,y0=66,S=140,n=14,c=S/n;
  for(let i=1;i<n;i++){ g.appendChild(el('line',{x1:x0+i*c,y1:y0,x2:x0+i*c,y2:y0+S}));
    g.appendChild(el('line',{x1:x0,y1:y0+i*c,x2:x0+S,y2:y0+i*c})); }
  const hp=document.getElementById('hp'); hp.setAttribute('x',x0+8*c); hp.setAttribute('y',y0+5*c);
  hp.setAttribute('width',c); hp.setAttribute('height',c);
})();
// токены: [CLS] + ряд патч-токенов
(function(){ const g=document.getElementById('tokens'); const y=112, w=20, h=48, gap=4, x0=334;
  const T=(x,y,t,col,sz,w2)=>{const e=el('text',{x,y,'text-anchor':'middle','font-family':'Manrope,system-ui','font-size':sz||12,'font-weight':w2||700,fill:col});e.textContent=t;g.appendChild(e);};
  // CLS
  g.appendChild(el('rect',{x:x0,y,width:w,height:h,rx:4,fill:'color-mix(in srgb,var(--s2) 28%,transparent)',stroke:'var(--s2)','stroke-width':2}));
  T(x0+w/2, y+h+15,'[CLS]','var(--s2)',11.5,700);
  // патч-токены
  const labels=['t₁','t₂','t₃','t₄','t₅','t₆','t₇','t₈','t₉','t₁₀','…','t₁₉₆'];
  for(let i=0;i<labels.length;i++){ const x=x0+(i+1)*(w+gap)+8;
    if(labels[i]==='…'){ T(x+w/2,y+h/2+5,'…','var(--ink-2)',18,700); continue; }
    g.appendChild(el('rect',{x,y,width:w,height:h,rx:4,fill:'color-mix(in srgb,var(--s1) 16%,transparent)',stroke:'var(--s1)','stroke-width':1.4}));
    T(x+w/2, y+h+15, labels[i], 'var(--s1)',11,600);
  }
})();
</script>
</body>
</html>
