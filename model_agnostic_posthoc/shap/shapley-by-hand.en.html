<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compute a SHAP value by hand: φ(cats)</title>
<link rel="stylesheet" href="/xai-course-visual/assets/viz.css">
<style>
  body.viz{padding:16px}
  .formula{font-size:14px; color:var(--ink-2); background:var(--surface); border:1px solid var(--line);
           border-radius:10px; padding:9px 12px; margin:0 0 12px}
  .ctrls{display:flex; gap:8px; align-items:center; margin-bottom:12px}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
         padding:14px 15px; margin-bottom:14px}
  .panel .s{font-size:var(--fs-body); color:var(--ink); margin-bottom:10px}
  .panel .s b{font-weight:700}
  .chip{display:inline-block; font-size:12.5px; padding:2px 9px; border-radius:999px; border:1px solid var(--line);
        color:var(--ink-2); margin-right:5px}
  .chip.on{border-color:var(--ink-2); color:var(--ink); font-weight:600}
  .chip.cats{border-color:var(--s2); color:var(--s2); font-weight:700}
  .axis{position:relative; height:46px; margin:6px 4px 2px}
  .axis .track{position:absolute; left:0; right:0; top:22px; height:3px; background:var(--line); border-radius:2px}
  .axis .seg{position:absolute; top:22px; height:3px; background:var(--s2); border-radius:2px}
  .axis .mk{position:absolute; top:16px; width:15px; height:15px; border-radius:50%; transform:translateX(-50%); border:2px solid var(--surface)}
  .axis .mk.a{background:var(--s1)} .axis .mk.b{background:var(--s2)}
  .axis .cap{position:absolute; top:0; transform:translateX(-50%); font-size:11.5px; color:var(--ink-2); white-space:nowrap}
  .axis .capb{position:absolute; top:32px; transform:translateX(-50%); font-size:11.5px; font-weight:600; white-space:nowrap}
  .nums{display:flex; gap:18px; flex-wrap:wrap; font-size:14px; margin-top:6px}
  .nums b{font-weight:700; font-variant-numeric:tabular-nums}
  .nums .red{color:var(--s2)}
  table.t{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:14px}
  table.t th, table.t td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line)}
  table.t th:first-child, table.t td:first-child{text-align:left}
  table.t thead th{color:var(--ink-2); font-weight:600; border-bottom:1.5px solid var(--ink)}
  table.t tr.dim{opacity:.35}
  table.t tr.cur td{background:color-mix(in srgb, var(--accent) 12%, transparent)}
  .total{font-size:20px; font-weight:700; margin-top:12px}
  .total .v{color:var(--s2)}
</style>
</head>
<body class="viz" data-palette="shap">
  <div class="viz-head">
    <h1>Compute a SHAP value by hand: φ(cats)</h1>
    <p>Features N = {accounts_count, cats, photos}. We enumerate coalitions S without cats; for each we take the weight, the gain Δ = v(S∪cats) − v(S), and their product. The sum = the Shapley value for cats.</p>
  </div>
  <div class="ctrls">
    <button id="next" class="viz-tab">Step ▶</button>
    <button id="reset" class="viz-tab">⟲ Reset</button>
    <span class="viz-label" id="stepinfo"></span>
  </div>

  <div class="panel" id="panel"></div>

  <table class="t">
    <thead><tr><th>S</th><th>weight</th><th>v(S)</th><th>v(S∪cats)</th><th>Δ</th><th>weight·Δ</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="total" id="total"></div>

<script>
const ROWS = [
  {label:'∅',            has:[],               w:'1/3', wf:1/3, vS:0.548, vSi:0.6},
  {label:'{acc}',        has:['acc'],          w:'1/6', wf:1/6, vS:0.6,   vSi:0.6},
  {label:'{photos}',     has:['photos'],       w:'1/6', wf:1/6, vS:0.3,   vSi:0.45},
  {label:'{acc, photos}',has:['acc','photos'], w:'1/3', wf:1/3, vS:0.4,   vSi:0.5},
];
ROWS.forEach(r=>{ r.d=+(r.vSi-r.vS).toFixed(3); r.prod=r.wf*r.d; });
const A0=0.2, A1=0.7;
let step = 0;

const panel=document.getElementById('panel'), tbody=document.getElementById('tbody'),
      total=document.getElementById('total'), stepinfo=document.getElementById('stepinfo');
const ax = v => ((v-A0)/(A1-A0)*100).toFixed(1)+'%';

function render(){
  stepinfo.textContent = `Coalition ${Math.min(step,4)} of 4`;
  if(step===0){
    panel.innerHTML = `<div class="s" style="color:var(--ink-2)">Press “Step ▶” to enumerate the coalitions without cats.</div>`;
  } else {
    const r=ROWS[step-1];
    const chips = ['acc','photos'].map(f=>`<span class="chip ${r.has.includes(f)?'on':''}">${f}</span>`).join('')
      + `<span class="chip cats">+ cats</span>`;
    panel.innerHTML =
      `<div class="s">Coalition <b>S = ${r.label}</b> &nbsp; ${chips}</div>`+
      `<div class="axis"><div class="track"></div>`+
        `<div class="seg" style="left:${ax(Math.min(r.vS,r.vSi))}; width:${((Math.abs(r.d))/(A1-A0)*100).toFixed(1)}%"></div>`+
        `<div class="mk a" style="left:${ax(r.vS)}"></div>`+
        `<div class="mk b" style="left:${ax(r.vSi)}"></div>`+
        `<div class="cap" style="left:${ax(r.vS)}">v(S)=${r.vS.toFixed(3)}</div>`+
        `<div class="capb" style="left:${ax(r.vSi)}">v(S∪cats)=${r.vSi.toFixed(2)}</div>`+
      `</div>`+
      `<div class="nums"><span>weight = <b>${r.w}</b></span>`+
        `<span class="red">Δ = <b>${(r.d>=0?'+':'−')+Math.abs(r.d).toFixed(3)}</b></span>`+
        `<span>contribution = weight·Δ = <b>${r.prod.toFixed(3)}</b></span></div>`;
  }
  tbody.innerHTML = ROWS.map((r,i)=>{
    const cls = i>=step ? 'dim' : (i===step-1 ? 'cur' : '');
    const show = i<step;
    return `<tr class="${cls}"><td>${r.label}</td><td>${r.w}</td>`+
      `<td>${show?r.vS.toFixed(3):'—'}</td><td>${show?r.vSi.toFixed(2):'—'}</td>`+
      `<td>${show?(r.d>=0?'+':'−')+Math.abs(r.d).toFixed(3):'—'}</td>`+
      `<td>${show?r.prod.toFixed(3):'—'}</td></tr>`;
  }).join('');
  const partial = ROWS.slice(0,step);
  const s = partial.reduce((a,r)=>a+r.prod,0);
  if(step===0){ total.innerHTML=''; }
  else {
    const expr = partial.map(r=>r.prod.toFixed(3)).join(' + ');
    total.innerHTML = step<4 ? `Sh(cats) = ${expr} …`
      : `Sh(cats) = ${expr} ≈ <span class="v">${s.toFixed(3)}</span>`;
  }
  document.getElementById('next').disabled = (step>=4);
}
document.getElementById('next').onclick=()=>{ if(step<4){step++; render();} };
document.getElementById('reset').onclick=()=>{ step=0; render(); };
render();
</script>
</body>
</html>
