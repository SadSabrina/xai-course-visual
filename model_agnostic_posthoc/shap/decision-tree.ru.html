<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Модель: дерево решений</title>
<link rel="stylesheet" href="/xai-course-visual/assets/viz.css">
</head>
<body class="viz" data-palette="shap">

  <div class="viz-stage" style="aspect-ratio:auto"><canvas id="c" style="min-height:470px"></canvas></div>

<script src="/xai-course-visual/assets/viz.js"></script>
<script>
// узлы дерева: x,y в [0..1], text, leaf
const N = {
  root:   {x:0.42, y:0.09, text:'cats == 1'},
  acc10:  {x:0.21, y:0.35, text:'accounts_c > 10'},
  photos: {x:0.60, y:0.35, text:'photos > 7'},
  l06:    {x:0.12, y:0.62, text:'p = 0.6',  leaf:true},
  l04a:   {x:0.31, y:0.62, text:'p = 0.4',  leaf:true},
  l07:    {x:0.47, y:0.62, text:'p = 0.7',  leaf:true},
  acc3:   {x:0.74, y:0.62, text:'accounts_c > 3'},
  l065:   {x:0.65, y:0.90, text:'p = 0.65', leaf:true},
  l04b:   {x:0.87, y:0.90, text:'p = 0.4',  leaf:true},
};
const E = [
  ['root','acc10','да'], ['root','photos','нет'],
  ['acc10','l06','да'],  ['acc10','l04a','нет'],
  ['photos','l07','да'], ['photos','acc3','нет'],
  ['acc3','l065','да'],  ['acc3','l04b','нет'],
];
const css=n=>VIZ.css(n);

VIZ.mount(document.getElementById('c'), (ctx,W,H)=>{
  ctx.clearRect(0,0,W,H);
  const mn=Math.min(W,H);
  drawFlowers(ctx, W*0.12, H*0.82, mn*0.12);
  drawCat(ctx, W*0.86, H*0.21, mn*0.082);
  const padX=Math.max(24,W*0.04), padY=Math.max(20,H*0.06);
  const fs=Math.max(12,Math.min(W,H)*0.028);
  const px=n=>padX+n.x*(W-2*padX), py=n=>padY+n.y*(H-2*padY);

  // размеры узлов
  for(const k in N){ const n=N[k];
    ctx.font=`600 ${fs}px Manrope, system-ui, sans-serif`;
    const tw=ctx.measureText(n.text).width;
    const ph=n.leaf?14:17, pv=n.leaf?8:11;
    n.w=tw+2*ph; n.h=fs+2*pv; n.cx=px(n); n.cy=py(n);
  }

  // рёбра
  E.forEach(([a,b,lab])=>{
    const A=N[a], B=N[b];
    const x1=A.cx, y1=A.cy+A.h/2, x2=B.cx, y2=B.cy-B.h/2;
    ctx.strokeStyle=css('--ink-2'); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    // стрелка
    const ang=Math.atan2(y2-y1,x2-x1), hd=7; ctx.fillStyle=css('--ink-2');
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hd*Math.cos(ang-0.4), y2-hd*Math.sin(ang-0.4));
    ctx.lineTo(x2-hd*Math.cos(ang+0.4), y2-hd*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fill();
    // метка да/нет
    const t=0.30, lx=x1+(x2-x1)*t, ly=y1+(y2-y1)*t;
    const nx=-(y2-y1), ny=(x2-x1), L=Math.hypot(nx,ny)||1;
    const ox=lx+nx/L*11, oy=ly+ny/L*11;
    ctx.fillStyle=css('--ink-2'); ctx.font=`600 ${fs*0.82}px system-ui, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=3; ctx.strokeStyle=css('--plane'); ctx.strokeText(lab,ox,oy); ctx.fillText(lab,ox,oy);
  });

  // узлы
  for(const k in N){ const n=N[k];
    ctx.fillStyle=css('--surface');
    ctx.strokeStyle=n.leaf?css('--accent'):css('--ink-2');
    ctx.lineWidth=n.leaf?1.6:1.7;
    ctx.beginPath(); ctx.roundRect(n.cx-n.w/2, n.cy-n.h/2, n.w, n.h, n.leaf?n.h/2:10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle=css('--ink'); ctx.font=`${n.leaf?700:600} ${fs}px Manrope, system-ui, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(n.text, n.cx, n.cy);
  }
});

// --- декоративный котик ---
function drawCat(ctx,cx,cy,r){
  const ink=css('--ink-2'), surf=css('--surface'), muted=css('--muted');
  const ear=(s)=>{ ctx.fillStyle=surf; ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx+s*r*0.55,cy-r*0.5); ctx.lineTo(cx+s*r*0.95,cy-r*1.15); ctx.lineTo(cx+s*r*1.05,cy-r*0.3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f2a9bb'; ctx.beginPath(); ctx.moveTo(cx+s*r*0.66,cy-r*0.55); ctx.lineTo(cx+s*r*0.9,cy-r*0.98); ctx.lineTo(cx+s*r*0.95,cy-r*0.45); ctx.closePath(); ctx.fill(); };
  ear(-1); ear(1);
  ctx.fillStyle=surf; ctx.strokeStyle=ink; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.fill(); ctx.stroke();
  ctx.strokeStyle=ink; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.arc(cx-r*0.4,cy-r*0.02,r*0.22,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx+r*0.4,cy-r*0.02,r*0.22,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  ctx.fillStyle='#e8899e'; ctx.beginPath(); ctx.moveTo(cx-r*0.1,cy+r*0.16); ctx.lineTo(cx+r*0.1,cy+r*0.16); ctx.lineTo(cx,cy+r*0.3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=ink; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(cx,cy+r*0.3); ctx.quadraticCurveTo(cx-r*0.16,cy+r*0.44,cx-r*0.3,cy+r*0.3);
  ctx.moveTo(cx,cy+r*0.3); ctx.quadraticCurveTo(cx+r*0.16,cy+r*0.44,cx+r*0.3,cy+r*0.3); ctx.stroke();
  ctx.strokeStyle=muted; ctx.lineWidth=1.3;
  [-1,1].forEach(s=>{ [0.06,0.2].forEach(dy=>{ ctx.beginPath(); ctx.moveTo(cx+s*r*0.55,cy+r*(0.1+dy)); ctx.lineTo(cx+s*r*1.2,cy+r*(0.04+dy)); ctx.stroke(); }); });
}
// --- декоративные цветочки (пионы) ---
function drawFlowers(ctx,x,y,s){
  ctx.fillStyle='#8bbf85';
  ctx.beginPath(); ctx.ellipse(x+s*0.15,y+s*0.55,s*0.55,s*0.2,-0.5,0,2*Math.PI); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+s*0.85,y+s*0.5,s*0.5,s*0.18,0.5,0,2*Math.PI); ctx.fill();
  const flower=(fx,fy,rp,petal,center)=>{
    ctx.fillStyle=petal;
    for(let i=0;i<6;i++){ const a=i/6*2*Math.PI;
      ctx.beginPath(); ctx.ellipse(fx+Math.cos(a)*rp*0.9, fy+Math.sin(a)*rp*0.9, rp*0.62, rp*0.4, a, 0,2*Math.PI); ctx.fill(); }
    ctx.fillStyle=center; ctx.beginPath(); ctx.arc(fx,fy,rp*0.5,0,2*Math.PI); ctx.fill();
  };
  flower(x, y, s*0.5, '#f2a6bd', '#ecc24e');
  flower(x+s*0.72, y+s*0.12, s*0.4, '#f7c2d2', '#efcd60');
}
</script>
</body>
</html>
