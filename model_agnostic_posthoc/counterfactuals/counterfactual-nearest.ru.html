<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контрфактуал: ближайшая точка другого класса</title>
<link rel="stylesheet" href="/xai-course-visual/assets/viz.css">
</head>
<body class="viz" data-palette="anchors">
  <div class="viz-stage" style="aspect-ratio:auto;min-height:460px"><canvas id="c"></canvas></div>

  <div class="viz-controls">
    <div class="viz-legend">
      <span class="item"><span class="swatch" style="background:var(--s1)"></span>класс A — прогноз y (сейчас)</span>
      <span class="item"><span class="swatch" style="background:#d9564e"></span>класс B — желаемый y′</span>
      <span class="item"><span style="color:var(--ink);font-size:15px">★</span>&nbsp;объект x</span>
      <span class="item"><span style="display:inline-block;width:11px;height:11px;border:2px solid var(--s2);border-radius:50%;vertical-align:middle"></span>&nbsp;контрфактуал (CF)</span>
      <span class="item"><span style="display:inline-block;width:16px;height:0;border-top:2px solid var(--s2);vertical-align:middle"></span>&nbsp;действие Δ = x′ − x</span>
    </div>
  </div>

<script src="/xai-course-visual/assets/viz.js"></script>
<script>
const RED='#d9564e';
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const bnd = x1 => 5.4 - 0.15*x1 + 0.55*Math.sin(0.6*x1);
const X=[5.2, 3.4];
const rnd=mul(58), BLUE=[], REDS=[];
for(let i=0;i<120;i++){ const a=1+rnd()*8, b=0.5+rnd()*9; (b>bnd(a)?REDS:BLUE).push([a,b]); }
const nearest = REDS.map(p=>({p,d:Math.hypot(p[0]-X[0],p[1]-X[1])})).sort((u,v)=>u.d-v.d);
const CF1=nearest[0], CF2=nearest[1];
const DX=[2.0,8.6], DY=[1.6,7.4];   // окно обзора
const css=n=>VIZ.css(n);

VIZ.mount(document.getElementById('c'), (ctx,W,H)=>{
  ctx.clearRect(0,0,W,H);
  const pad=Math.min(W,H)*0.085;
  const L=pad, R=W-pad, T=pad*0.7, Bt=H-pad*0.9;
  const xP=v=>L+(v-DX[0])/(DX[1]-DX[0])*(R-L);
  const yP=v=>Bt-(v-DY[0])/(DY[1]-DY[0])*(Bt-T);
  const indigo=css('--s2'), blue=css('--s1'), ink=css('--ink');

  ctx.save(); ctx.beginPath(); ctx.rect(L,T,R-L,Bt-T); ctx.clip();
  // регионы
  ctx.fillStyle=VIZ.alpha(blue,0.10); ctx.fillRect(L,T,R-L,Bt-T);
  ctx.beginPath(); ctx.moveTo(xP(DX[0]),yP(bnd(DX[0])));
  for(let x=DX[0];x<=DX[1]+0.01;x+=0.15) ctx.lineTo(xP(x),yP(bnd(x)));
  ctx.lineTo(R,T); ctx.lineTo(L,T); ctx.closePath();
  ctx.fillStyle=VIZ.alpha(RED,0.11); ctx.fill();
  // граница
  ctx.strokeStyle=css('--ink-2'); ctx.lineWidth=1.8; ctx.setLineDash([6,5]);
  ctx.beginPath();
  for(let x=DX[0];x<=DX[1]+0.01;x+=0.15){ const px=xP(x),py=yP(bnd(x)); x===DX[0]?ctx.moveTo(px,py):ctx.lineTo(px,py); }
  ctx.stroke(); ctx.setLineDash([]);
  // подпись региона (с halo для читаемости поверх точек)
  ctx.font=`600 ${Math.max(11,Math.min(W,H)*0.026)}px Manrope, system-ui, sans-serif`;
  ctx.lineWidth=3.5; ctx.strokeStyle=css('--surface'); ctx.lineJoin='round';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.strokeText('класс B (y′)', xP(DX[0])+8, yP(DY[1])+6);
  ctx.fillStyle=VIZ.alpha(RED,0.95);  ctx.fillText('класс B (y′)', xP(DX[0])+8, yP(DY[1])+6);
  ctx.textBaseline='bottom';
  ctx.strokeText('класс A (y)', xP(DX[0])+8, yP(DY[0])-6);
  ctx.fillStyle=VIZ.alpha(blue,0.95); ctx.fillText('класс A (y)', xP(DX[0])+8, yP(DY[0])-6);

  // окружность «ближайший» через CF1
  const cx=xP(X[0]), cy=yP(X[1]);
  const rr=Math.hypot(xP(CF1.p[0])-cx, yP(CF1.p[1])-cy);
  ctx.strokeStyle=VIZ.alpha(indigo,0.35); ctx.lineWidth=1.3; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.arc(cx,cy,rr,0,2*Math.PI); ctx.stroke(); ctx.setLineDash([]);

  // точки
  ctx.fillStyle=blue; for(const[a,b]of BLUE){ ctx.beginPath(); ctx.arc(xP(a),yP(b),3,0,2*Math.PI); ctx.fill(); }
  ctx.fillStyle=RED;  for(const[a,b]of REDS){ ctx.beginPath(); ctx.arc(xP(a),yP(b),3,0,2*Math.PI); ctx.fill(); }

  // стрелки-действия
  VIZ.arrow(ctx, cx,cy, xP(CF1.p[0]),yP(CF1.p[1]), indigo, {width:2.8, trim2:11, headSize:11});
  VIZ.arrow(ctx, cx,cy, xP(CF2.p[0]),yP(CF2.p[1]), indigo, {width:1.8, trim2:10, headSize:9, dash:[5,4], alpha:0.6});

  // маркеры CF
  const mark=(cf,primary,label)=>{
    const mx=xP(cf.p[0]), my=yP(cf.p[1]);
    ctx.beginPath(); ctx.arc(mx,my, primary?7:6, 0,2*Math.PI);
    ctx.fillStyle=RED; ctx.fill();
    ctx.strokeStyle=indigo; ctx.lineWidth=primary?3:2.2; ctx.stroke();
    ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.strokeStyle=css('--surface');
    ctx.font=`700 ${Math.max(12,Math.min(W,H)*0.03)}px Manrope, system-ui, sans-serif`;
    ctx.lineWidth=3.5; ctx.strokeText(label, mx+11, my- (primary?12:11));
    ctx.fillStyle=indigo; ctx.fillText(label, mx+11, my- (primary?12:11));
    ctx.font=`600 ${Math.max(10,Math.min(W,H)*0.024)}px Manrope, system-ui, sans-serif`;
    ctx.lineWidth=3; ctx.strokeText('d = '+cf.d.toFixed(2), mx+11, my+ (primary?7:6));
    ctx.fillStyle=css('--ink-2'); ctx.fillText('d = '+cf.d.toFixed(2), mx+11, my+ (primary?7:6));
  };
  mark(CF2,false,'CF₂');
  mark(CF1,true,'CF₁');

  // объект x — звезда
  ctx.fillStyle=ink; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`${Math.max(17,Math.min(W,H)*0.042)}px system-ui, sans-serif`; ctx.fillText('★', cx, cy);
  ctx.font=`700 ${Math.max(13,Math.min(W,H)*0.032)}px Manrope, system-ui, sans-serif`;
  ctx.textAlign='right'; ctx.textBaseline='top'; ctx.fillText('x', cx-9, cy+4);
  ctx.restore();

  ctx.strokeStyle=css('--line'); ctx.lineWidth=1; ctx.strokeRect(L,T,R-L,Bt-T);
});
</script>
</body>
</html>
