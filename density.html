<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плотность точек двух кластеров</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --ink:#e8ecf4; --muted:#9aa6bd;
    --a:#4c8dff; --b:#ff9f45; --line:#26304a;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --panel:#ffffff; --ink:#141a26; --muted:#5b667c; --line:#e2e7f1; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       display:flex;flex-direction:column;padding:12px;gap:10px}
  .head{flex:0 0 auto}
  .head h1{font-size:16px;margin:0 0 2px}
  .head p{color:var(--muted);margin:0;font-size:12.5px}
  .stage{flex:1 1 auto;position:relative;min-height:0;
         background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .controls{flex:0 0 auto}
  .row{display:flex;align-items:center;gap:12px}
  input[type=range]{flex:1;accent-color:var(--a);height:24px}
  .label{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:40px;text-align:right}
  .stats{display:flex;gap:8px;margin-top:8px}
  .stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
  .stat .k{color:var(--muted);font-size:11px}
  .stat .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
  .dotA{color:var(--a)}
</style>
</head>
<body>
  <div class="head">
    <h1>Что такое плотность точек</h1>
    <p>Крути плотность от 0 до 1. Точек столько же — меняется площадь (area). Плотность = n_points ÷ area.</p>
  </div>

  <div class="stage"><canvas id="c"></canvas></div>

  <div class="controls">
    <div class="row">
      <span class="label">Плотность</span>
      <input id="s" type="range" min="0" max="1" step="0.01" value="0.5">
      <span class="val" id="sv">0.50</span>
    </div>
  </div>

<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const slider = document.getElementById('s');
const sv = document.getElementById('sv');

const N = 160;                         // точек в каждом кластере (фиксировано)
let W = 0, H = 0;

// стандартные нормальные смещения — генерим один раз, чтобы облако плавно масштабировалось
function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const makeOffsets=n=>Array.from({length:n},()=>[gauss(),gauss()]);
const offA=makeOffsets(N), offB=makeOffsets(N);

function resize(){
  const r = cvs.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  cvs.width = Math.round(W*dpr);
  cvs.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw(parseFloat(slider.value));
}

function draw(d){
  if(!W||!H) return;
  ctx.clearRect(0,0,W,H);
  const base = Math.min(W,H);
  const spread = base*0.30 + (base*0.045 - base*0.30)*d;   // плотность 1 → сжато
  const cA={x:W*0.34,y:H*0.5,color:'#4c8dff',soft:'rgba(76,141,255,.13)'};
  const cB={x:W*0.66,y:H*0.5,color:'#ff9f45',soft:'rgba(255,159,69,.15)'};
  drawCluster(cA,offA,spread);
  drawCluster(cB,offB,spread);
}

function drawCluster(c,offs,spread){
  ctx.beginPath(); ctx.arc(c.x,c.y,2*spread,0,2*Math.PI);
  ctx.fillStyle=c.soft; ctx.fill();
  ctx.strokeStyle=c.color; ctx.globalAlpha=.35; ctx.lineWidth=2;
  ctx.setLineDash([6,7]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
  ctx.fillStyle=c.color;
  const dot=Math.max(2.5,Math.min(W,H)*0.008);
  for(const [ox,oy] of offs){
    ctx.beginPath(); ctx.arc(c.x+ox*spread,c.y+oy*spread,dot,0,2*Math.PI); ctx.fill();
  }
}

slider.addEventListener('input',()=>{sv.textContent=parseFloat(slider.value).toFixed(2);draw(parseFloat(slider.value));});
new ResizeObserver(resize).observe(cvs);
resize();
</script>
</body>
</html>
